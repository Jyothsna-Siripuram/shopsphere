# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  errors:
    messages:
      # Custom validation messages referenced by symbol from the models. Defined
      # here rather than inline so the API can be localised later without
      # touching model code, and so a typo surfaces as a missing translation
      # instead of shipping a symbol to a customer.
      invalid_slug: "must be lowercase letters, numbers and single hyphens"
      cannot_be_self: "cannot be the record itself"
      must_follow_start: "must be after the start time"
      does_not_match_components: "must equal subtotal minus discount, plus tax and shipping"
      does_not_match_unit_price: "must equal unit price multiplied by quantity"
      must_belong_to_reviewer: "must belong to an order placed by this customer"
